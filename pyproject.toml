[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trifusesurv2"
version = "2.1.5"
description = "TriFuseSurv2: habitat-aligned, node-aware OPSCC survival modeling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "einops",
  "monai",
  "numpy",
  "pandas",
  "pydicom",
  "scikit-learn",
  "scipy",
  "SimpleITK",
  "torch>=2.5,<2.10",
]

[project.optional-dependencies]
radiomics = ["pyradiomics"]
qc = ["matplotlib"]
study = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scikit-survival==0.25.0",
]

[project.scripts]
trifusesurv2-train = "trifusesurv2.multimodal_survival.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
