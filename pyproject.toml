[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trifusesurv2"
version = "2.1.3"
description = "TriFuseSurv2: habitat-aligned, node-aware OPSCC survival modeling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "einops",
  "monai",
  "numpy",
  "opencv-python-headless==4.10.0.84",
  "pandas",
  "pydicom",
  "rt-utils",
  "scikit-learn",
  "SimpleITK",
  "torch==2.9.1",
]

[project.scripts]
trifusesurv2-train = "trifusesurv2.multimodal_survival.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
