[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trifusesurv"
version = "0.1.0"
description = "TriFuseSurv survival and segmentation workflows packaged as an installable Python project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "monai",
  "numpy",
  "opencv-python-headless",
  "pandas",
  "pydicom",
  "rt-utils",
  "scikit-learn",
  "shap",
  "SimpleITK",
  "torch",
]

[project.scripts]
trifusesurv-moe-train = "trifusesurv.cli.moe_discrete_swinunetr:main"
trifusesurv-moe-train-lora = "trifusesurv.cli.moe_discrete_swinunetr_lora:main"
trifusesurv-seg-pretrain = "trifusesurv.cli.pretrain_swinunetr_seg:main"
trifusesurv-seg-eval = "trifusesurv.cli.eval_pretrain_swinunetr_seg:main"
trifusesurv-seg-gradcam = "trifusesurv.cli.gradcam_pretrain_swinunetr_seg:main"
trifusesurv-shap-tokens = "trifusesurv.cli.shap_joint_model_tokens:main"
trifusesurv-shap-export-grouped = "trifusesurv.cli.export_oof_shap_grouped:main"
trifusesurv-shap-export-grouped-v2 = "trifusesurv.cli.export_oof_shap_grouped2:main"
trifusesurv-stage1-train-seg = "trifusesurv.segmentation.train:main"
trifusesurv-stage1-eval-seg = "trifusesurv.segmentation.evaluate:main"
trifusesurv-stage1-gradcam-seg = "trifusesurv.segmentation.gradcam:main"
trifusesurv-stage2-train-survival = "trifusesurv.multimodal_survival.train:main"
trifusesurv-stage2-train-survival-lora = "trifusesurv.multimodal_survival.train:main"
trifusesurv-stage2-shap-tokens = "trifusesurv.multimodal_survival.explain_tokens:main"
trifusesurv-stage2-shap-grouped = "trifusesurv.multimodal_survival.export_grouped_shap:main"
trifusesurv-stage2-shap-grouped-v2 = "trifusesurv.multimodal_survival.export_grouped_shap:main"
trifusesurv-preprocess-export-swinunetr = "trifusesurv.preprocessing.export_swinunetr:main"
trifusesurv-make-cv-splits = "trifusesurv.preprocessing.make_cv_splits:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
